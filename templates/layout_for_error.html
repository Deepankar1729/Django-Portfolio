{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Try Again {% endblock %}</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-light d-flex justify-content-center align-items-center vh-100">
    
  <div class="text-center">
        <div class="card shadow p-5 border-0" style="max-width: 450px; border-radius: 1.5rem;">            
            <!-- Icon -->
            <div class="text-danger mb-3">
                <i class="bi bi-exclamation-triangle display-1"></i>
            </div>

            <!-- Error message -->
            <h1 class="h3 text-danger mb-3">
                {% block content %}
                    Oops! Something Went Wrong
                {% endblock %}
            </h1>
            <p class="text-muted mb-4">
                {% block message %}
                    We couldn’t complete your request. Please try again.
                {% endblock %}
            </p>

            <!-- Action buttons -->
            <div class="d-grid gap-2">
                <a href="{% url 'home' %}" class="btn btn-primary btn-lg">
                    <i class="bi bi-arrow-repeat"></i> Please Try Again
                </a>
                {% comment %} <a href="/" class="btn btn-outline-secondary">
                    <i class="bi bi-house-door"></i> Go Home
                </a> {% endcomment %}
            </div>
        </div>
    </div>
</body>
</html>
